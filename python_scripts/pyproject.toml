[project]
name = "shk"
version = "0.0.0.dev1"
authors = [{ name = "Jim Hessin", email = "jhessin@gmail.com" }]
requires-python = ">=3.12,<4.0"

dependencies = []
[dependency-groups]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.4.0,<0.5.0",
  "mypy>=1.10.0,<2.0.0",
  "ipython>=9.14.1",
  "ruff>=0.4.10",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["shk"]

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true
